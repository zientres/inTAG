<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061426">
  <title data-i18n="auctionsPageTitle">TagitalSpace — Аукционы</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .settings-button {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      border: 1px solid rgba(120, 186, 255, 0.35);
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .settings-button:hover {
      background: rgba(120, 186, 255, 0.1);
      border-color: #78baff;
    }

    .settings-button span {
      width: 19px;
      height: 2px;
      border-radius: 2px;
      background: #f3f6fb;
    }

    .settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.48);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s, visibility 0.25s;
    }

    .settings-overlay.is-open {
      opacity: 1;
      visibility: visible;
    }

    .settings-drawer {
      position: fixed;
      z-index: 101;
      top: 0;
      right: 0;
      width: min(360px, 88vw);
      height: 100vh;
      height: 100dvh;
      padding: 30px 26px;
      overflow-y: auto;
      background: #091a2e;
      border-left: 1px solid rgba(120, 186, 255, 0.18);
      box-shadow: -15px 0 45px rgba(0, 0, 0, 0.25);
      transform: translateX(102%);
      transition: transform 0.28s ease;
    }

    .settings-drawer.is-open {
      transform: translateX(0);
    }

    .settings-drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 38px;
    }

    .settings-drawer-title {
      color: #f3f6fb;
      font-size: 23px;
      font-weight: 650;
    }

    .settings-close {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(120, 186, 255, 0.25);
      border-radius: 8px;
      color: #f3f6fb;
      background: transparent;
      font-size: 25px;
      cursor: pointer;
    }

    .settings-close:hover {
      background: rgba(120, 186, 255, 0.1);
    }

    .settings-label {
      display: block;
      margin-bottom: 14px;
      color: #a8b8cc;
      font-size: 13px;
    }

    .language-options {
      display: grid;
      gap: 10px;
    }

    .language-option {
      width: 100%;
      min-height: 52px;
      padding: 0 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(120, 186, 255, 0.18);
      border-radius: 9px;
      color: #dce7f5;
      background: rgba(255, 255, 255, 0.025);
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .language-option:hover {
      background: rgba(120, 186, 255, 0.08);
    }

    .language-option.is-active {
      border-color: #78baff;
      background: rgba(120, 186, 255, 0.1);
      color: #fff;
    }

    .language-check {
      color: #78baff;
      opacity: 0;
    }

    .language-option.is-active .language-check {
      opacity: 1;
    }

    body.settings-open {
      overflow: hidden;
    }

    @media (max-width: 700px) {
      .settings-button {
        width: 38px;
        height: 38px;
      }

      .settings-drawer {
        padding: 25px 21px;
      }

      .marketplace-card {
        padding: 16px;
      }

      .marketplace-heading h3 {
        font-size: 19px;
      }

      .community-link-card {
        flex: initial;
      }
    }
  
    .auctions-page {
      width: min(100% - 48px, 980px);
      margin: 0 auto;
      padding: 84px 0 110px;
    }
    .auctions-page-eyebrow {
      margin: 0 0 18px;
      color: #8fa6c0;
      font-size: 12px;
      letter-spacing: .16em;
    }
    .auctions-page-title {
      margin: 0;
      color: #f3f6fb;
      font-size: clamp(32px, 5vw, 48px);
      line-height: 1.12;
      font-weight: 620;
    }
    .auctions-page-intro {
      max-width: 700px;
      margin: 20px 0 0;
      color: #aebed1;
      font-size: 15px;
      line-height: 1.7;
    }
    .auctions-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 34px 0 20px;
    }
    .auctions-toolbar-label {
      color: #dce7f5;
      font-size: 14px;
    }
    .auctions-refresh {
      min-height: 40px;
      padding: 0 16px;
      border: 1px solid rgba(120,186,255,.3);
      border-radius: 8px;
      color: #eaf2fc;
      background: rgba(120,186,255,.06);
      font: inherit;
      cursor: pointer;
    }
    .auctions-refresh:hover {
      border-color: #78baff;
      background: rgba(120,186,255,.12);
    }
    .auctions-message {
      min-height: 24px;
      margin: 0 0 18px;
      color: #9fb2c9;
      font-size: 14px;
      line-height: 1.5;
    }
    .auctions-list {
      display: grid;
      gap: 14px;
    }
    .auction-card {
      padding: 24px;
      border: 1px solid rgba(120,186,255,.16);
      border-radius: 14px;
      background: rgba(8,24,42,.58);
    }
    .auction-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }
    .auction-plate {
      margin: 0;
      color: #f4f7fb;
      font-size: clamp(25px, 4vw, 34px);
      letter-spacing: .05em;
      font-weight: 650;
    }
    .auction-id {
      margin-top: 7px;
      color: #8195ad;
      font-size: 12px;
    }
    .auction-status {
      flex: 0 0 auto;
      padding: 7px 10px;
      border: 1px solid rgba(120,186,255,.2);
      border-radius: 6px;
      color: #b9cce1;
      font-size: 12px;
    }
    .auction-data {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px 28px;
      margin: 24px 0;
    }
    .auction-data-item {
      display: grid;
      gap: 6px;
    }
    .auction-data-label {
      color: #8499b1;
      font-size: 12px;
    }
    .auction-data-value {
      color: #e6eef8;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }
    .auction-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      padding-top: 18px;
      border-top: 1px solid rgba(120,186,255,.12);
    }
    .auction-bid-form {
      display: flex;
      flex: 1 1 320px;
      gap: 10px;
    }
    .auction-bid-input {
      width: 150px;
      min-width: 0;
      min-height: 42px;
      padding: 0 12px;
      border: 1px solid rgba(120,186,255,.24);
      border-radius: 8px;
      color: #f3f6fb;
      background: rgba(2,12,23,.6);
      font: inherit;
    }
    .auction-action-button {
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid rgba(120,186,255,.38);
      border-radius: 8px;
      color: #f3f6fb;
      background: rgba(120,186,255,.1);
      font: inherit;
      cursor: pointer;
    }
    .auction-action-button:hover {
      background: rgba(120,186,255,.18);
    }
    .auction-action-button:disabled,
    .auctions-refresh:disabled {
      opacity: .55;
      cursor: wait;
    }
    @media (max-width: 600px) {
      .auctions-page {
        width: min(100% - 32px, 980px);
        padding-top: 56px;
      }
      .auction-card {
        padding: 18px;
      }
      .auction-data {
        gap: 16px 12px;
      }
      .auction-actions,
      .auction-bid-form {
        width: 100%;
      }
      .auction-bid-form {
        flex-direction: column;
      }
      .auction-bid-input,
      .auction-action-button {
        width: 100%;
      }
    }

  </style>
</head>
<body>
  <header class="header">
    <a class="brand" href="index.html" aria-label="TagitalSpace — главная">
      <img
        src="logo.png"
        alt="Логотип TagitalSpace"
        class="brand-logo"
        draggable="false"
      >
      <span>TagitalSpace</span>
    </a>

    <nav class="navigation" aria-label="Основная навигация">
      <a href="collection.html" data-i18n="navCollection">Коллекции</a>
      <a href="auctions.html" data-i18n="navAuctions">Аукционы</a>
      <a href="community.html" data-i18n="navCommunity">Сообщество</a>
    </nav>

    <div class="header-actions">
      <button
        class="header-button"
        id="connect-wallet"
        type="button"
        data-i18n="connectWallet"
        aria-haspopup="dialog"
      >Подключить кошелёк</button>

      <button
        class="settings-button"
        id="settings-open"
        type="button"
        aria-label="Открыть настройки"
        aria-controls="settings-drawer"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

    <div
    class="settings-overlay"
    id="settings-overlay"
    aria-hidden="true"
  ></div>

  <aside
    class="settings-drawer"
    id="settings-drawer"
    aria-label="Настройки"
    aria-hidden="true"
    inert
  >
    <div class="settings-drawer-header">
      <h2 class="settings-drawer-title" data-i18n="settingsTitle">
        Настройки
      </h2>

      <button
        class="settings-close"
        id="settings-close"
        type="button"
        aria-label="Закрыть настройки"
      >×</button>
    </div>

    <div class="settings-section">
      <span class="settings-label" data-i18n="languageLabel">
        Язык сайта
      </span>

      <div class="language-options">
        <button
          class="language-option is-active"
          type="button"
          data-language="ru"
          aria-pressed="true"
        >
          <span>Русский</span>
          <span class="language-check" aria-hidden="true">✓</span>
        </button>

        <button
          class="language-option"
          type="button"
          data-language="en"
          aria-pressed="false"
        >
          <span>English</span>
          <span class="language-check" aria-hidden="true">✓</span>
        </button>
      </div>
    </div>
  </aside>

  <main class="auctions-page">
    <section aria-labelledby="auctions-page-title">
      <p class="auctions-page-eyebrow" data-i18n="auctionsEyebrow">АУКЦИОНЫ</p>
      <h1 class="auctions-page-title" id="auctions-page-title" data-i18n="auctionsTitle">Выберите номер и запустите аукцион</h1>
      <p class="auctions-page-intro" data-i18n="auctionsIntro">Любой пользователь может запустить аукцион со своего кошелька. Победитель получает NFT с выбранным номерным знаком.</p>
      <div class="auctions-toolbar">
        <span class="auctions-toolbar-label" data-i18n="navAuctions">Аукционы</span>
        <button class="auctions-refresh" id="auctions-refresh" type="button" data-i18n="refreshAuctions">Обновить</button>
      </div>
      <p class="auctions-message" id="auctions-message" role="status" aria-live="polite"></p>
      <div class="auctions-list" id="auctions-list"></div>
    </section>
  </main>
  <script src="https://unpkg.com/@tonconnect/ui@3.0.0/dist/tonconnect-ui.min.js"></script>
  <script src="registry-client.js"></script>
  <script src="script.js"></script>
  <script>
    (() => {
      const list = document.getElementById("auctions-list");
      const message = document.getElementById("auctions-message");
      const refresh = document.getElementById("auctions-refresh");
      const english = () => document.documentElement.lang === "en";
      const copy = () => english() ? {
        loading: "Loading auctions…",
        empty: "There are no active auctions right now.",
        error: "Could not load auctions.",
        active: "Bidding is open",
        mint: "NFT mint confirmation pending",
        skip: "Closing without bids",
        starting: "Starting bid",
        current: "Current bid",
        next: "Minimum next bid",
        ends: "Ends",
        bidPlaceholder: "Amount in TON",
        bid: "Place bid",
        finish: "Finish auction",
        bidSent: "Bid request sent to your wallet. Refresh after the transaction is confirmed.",
        finishSent: "Finish request sent to your wallet. Refresh after the transaction is confirmed.",
        bidError: "Could not submit the bid.",
        finishError: "Could not finish the auction."
      } : {
        loading: "Загружаю аукционы…",
        empty: "Сейчас нет активных аукционов.",
        error: "Не удалось загрузить аукционы.",
        active: "Торги идут",
        mint: "Подтверждается выпуск NFT",
        skip: "Завершается без ставок",
        starting: "Начальная ставка",
        current: "Текущая ставка",
        next: "Минимальная следующая ставка",
        ends: "Окончание",
        bidPlaceholder: "Сумма в TON",
        bid: "Сделать ставку",
        finish: "Завершить аукцион",
        bidSent: "Запрос ставки отправлен в кошелёк. Обновите страницу после подтверждения транзакции.",
        finishSent: "Запрос завершения отправлен в кошелёк. Обновите страницу после подтверждения транзакции.",
        bidError: "Не удалось отправить ставку.",
        finishError: "Не удалось завершить аукцион."
      };
      const formatTon = value => (Number(value) / 1e9).toLocaleString(english() ? "en-GB" : "ru-RU", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + " TON";
      const formatDate = value => new Date(value * 1000).toLocaleString(english() ? "en-GB" : "ru-RU");
      function addDataItem(parent, label, value) {
        const item = document.createElement("div");
        item.className = "auction-data-item";
        const labelNode = document.createElement("span");
        labelNode.className = "auction-data-label";
        labelNode.textContent = label;
        const valueNode = document.createElement("span");
        valueNode.className = "auction-data-value";
        valueNode.textContent = value;
        item.append(labelNode, valueNode);
        parent.appendChild(item);
      }
      function createCard(auction) {
        const text = copy();
        const card = document.createElement("article");
        card.className = "auction-card";
        const top = document.createElement("div");
        top.className = "auction-card-top";
        const titleWrap = document.createElement("div");
        const plate = document.createElement("h2");
        plate.className = "auction-plate";
        plate.textContent = auction.plate;
        const id = document.createElement("div");
        id.className = "auction-id";
        id.textContent = "NFT #" + auction.itemIndex;
        titleWrap.append(plate, id);
        const status = document.createElement("span");
        status.className = "auction-status";
        status.textContent = auction.status === 0 ? text.active : auction.status === 1 ? text.mint : text.skip;
        top.append(titleWrap, status);
        card.appendChild(top);

        const data = document.createElement("div");
        data.className = "auction-data";
        const nextBid = auction.highestBid === 0n
          ? auction.startingBid
          : auction.highestBid + auction.minimumBidStep;
        addDataItem(data, text.starting, formatTon(auction.startingBid));
        addDataItem(data, text.current, auction.highestBid === 0n ? "—" : formatTon(auction.highestBid));
        addDataItem(data, text.next, formatTon(nextBid));
        addDataItem(data, text.ends, formatDate(auction.endTime));
        card.appendChild(data);

        if (auction.status === 0) {
          const actions = document.createElement("div");
          actions.className = "auction-actions";
          if (Date.now() / 1000 < auction.endTime) {
            const form = document.createElement("form");
            form.className = "auction-bid-form";
            const input = document.createElement("input");
            input.className = "auction-bid-input";
            input.type = "number";
            input.min = (Number(nextBid) / 1e9).toFixed(9);
            input.step = "0.01";
            input.placeholder = text.bidPlaceholder;
            input.setAttribute("aria-label", text.bidPlaceholder);
            input.required = true;
            const button = document.createElement("button");
            button.className = "auction-action-button";
            button.type = "submit";
            button.textContent = text.bid;
            form.append(input, button);
            form.addEventListener("submit", async event => {
              event.preventDefault();
              button.disabled = true;
              message.textContent = "";
              try {
                await window.tagitalSpaceRegistry.placeBid(auction.auctionId, input.value);
                message.textContent = text.bidSent;
              } catch (error) {
                message.textContent = error.message || text.bidError;
                button.disabled = false;
              }
            });
            actions.appendChild(form);
          } else {
            const button = document.createElement("button");
            button.className = "auction-action-button";
            button.type = "button";
            button.textContent = text.finish;
            button.addEventListener("click", async () => {
              button.disabled = true;
              message.textContent = "";
              try {
                await window.tagitalSpaceRegistry.finishAuction(auction.auctionId);
                message.textContent = text.finishSent;
              } catch (error) {
                message.textContent = error.message || text.finishError;
                button.disabled = false;
              }
            });
            actions.appendChild(button);
          }
          card.appendChild(actions);
        }
        return card;
      }
      async function loadAuctions() {
        const text = copy();
        refresh.disabled = true;
        list.replaceChildren();
        message.textContent = text.loading;
        try {
          if (!window.tagitalSpaceRegistry) throw new Error(text.error);
          const auctions = await window.tagitalSpaceRegistry.listAuctions();
          message.textContent = auctions.length ? "" : text.empty;
          for (const auction of auctions) list.appendChild(createCard(auction));
        } catch (error) {
          message.textContent = error.message || text.error;
        } finally {
          refresh.disabled = false;
        }
      }
      refresh.addEventListener("click", loadAuctions);
      loadAuctions();
    })();
  </script>
</body>
</html>

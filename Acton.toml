[package]
name = "tagitalspace-contracts"
description = "TagitalSpace TON Testnet NFT and auction contracts"
version = "0.1.0"
license = "MIT"

[toolchain]
acton = "1.2.0"

[contracts.NftCollection]
src = "contracts/nft-v1.1/NftCollection.tolk"
depends = ["NftItem"]

[contracts.NftItem]
src = "contracts/nft-v1.1/NftItem.tolk"
depends = []

[build]
output-fift = "build/fift"

[lint]
max-warnings = 0

[lint.rules]
dict-type-use = "allow"
throw-requires-errors-enum = "allow"

[fmt]
width = 100

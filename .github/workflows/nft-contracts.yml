name: NFT contracts

on:
  push:
    branches: [main]
    paths:
      - "Acton.toml"
      - "contracts/nft-v1.1/**"
      - "contracts/nft-v1.2/**"
      - "contracts/auction-manager/**"
      - "tests/nft-v1.1/**"
      - "tests/nft-v1.2/**"
      - "tests/auction-manager/**"
      - "wrappers/**"
      - "scripts/**"
      - ".github/workflows/nft-contracts.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build-and-test:
    name: Build and test NFT and auction contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup Acton
        uses: ton-blockchain/setup-acton@2d38fd579e1bf8753a3e0cff9ad695612b98a676

      - name: Show Acton version
        run: acton --version

      - name: Validate NFT metadata generator
        run: node --check scripts/generate-nft-metadata.mjs
      - name: Validate frontend JavaScript
        run: |
          node --check registry-client.js
          node --check script.js
          node <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("auctions.html", "utf8");
          const start = html.indexOf("<script>");
          const end = html.indexOf("</script>", start);
          if (start < 0 || end < 0) throw new Error("Could not find the inline auction-page script");
          new Function(html.slice(start + 8, end));
          NODE

      - name: Build contracts
        run: acton build

      - name: Check formatting
        run: acton fmt --check

      - name: Lint contracts
        run: acton check --output-format github

      - name: Run NFT v1.1 tests
        run: acton test tests/nft-v1.1

      - name: Run NFT v1.2 tests
        run: acton test tests/nft-v1.2

      - name: Run Auction Manager tests
        run: acton test tests/auction-manager

name: TON transaction diagnostic

on:
  push:
    branches: [auction-manager]
    paths:
      - ".github/workflows/ton-transaction-diagnostic.yml"
  workflow_dispatch:

permissions: {}

jobs:
  emulate-create-auction:
    name: Inspect Testnet state and emulate CreateAuctionV1
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect sender and Auction Manager account states
        env:
          SENDER: "0:256908ebbd1cfc1829b6209d505c0eab3464b2c987c7eae34f4f44732a36ba56"
          MANAGER: "kQD6NzXC1MeHqb8d4JienBNFM2nIEHdBumffmxKzHkg9HCot"
        run: |
          set -euo pipefail
          for entry in "sender:$SENDER" "manager:$MANAGER"; do
            label="${entry%%:*}"
            address="${entry#*:}"
            echo "===== $label account state ====="
            curl --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 60 \
              --silent --show-error --fail-with-body --get \
              "https://testnet.toncenter.com/api/v3/accountStates" \
              --data-urlencode "address=$address" \
              --data-urlencode "include_boc=false" | jq .
            sleep 1
          done

      - name: Check the exact plate status through the deployed contract
        env:
          MANAGER: "kQD6NzXC1MeHqb8d4JienBNFM2nIEHdBumffmxKzHkg9HCot"
          PLATE_HASH: "5e182b7cdbf43bc2b3eb55907688fa8fa19dda294b814d978d926266a4e19f20"
        run: |
          set -euo pipefail
          jq -n --arg address "$MANAGER" --arg hash "0x$PLATE_HASH" \
            '{address:$address,method:"get_plate_status",stack:[["num",$hash]]}' > getter-request.json
          curl --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 60 \
            --silent --show-error --fail-with-body \
            -H "Content-Type: application/json" \
            --data-binary @getter-request.json \
            "https://testnet.toncenter.com/api/v2/runGetMethod" | jq .
          sleep 1

      - name: Read recent Auction Manager transactions
        env:
          MANAGER: "kQD6NzXC1MeHqb8d4JienBNFM2nIEHdBumffmxKzHkg9HCot"
        run: |
          set -euo pipefail
          curl --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 60 \
            --silent --show-error --fail-with-body --get \
            "https://testnet.toncenter.com/api/v3/transactions" \
            --data-urlencode "account=$MANAGER" \
            --data-urlencode "limit=20" \
            --data-urlencode "sort=desc" | jq .

      - name: Emulate through the same TonAPI wallet endpoint used by Tonkeeper
        env:
          SENDER: "0:256908ebbd1cfc1829b6209d505c0eab3464b2c987c7eae34f4f44732a36ba56"
          MANAGER: "kQD6NzXC1MeHqb8d4JienBNFM2nIEHdBumffmxKzHkg9HCot"
          PAYLOAD: "te6cckEBAgEAKQABMlRHQQFoR2JuY9LL6UO5rKAEBfXhAGr2IxMBABbQkDMzM9CQ0JAzM1G3BEg="
        run: |
          set -euo pipefail
          npm install --no-save @ton/ton @ton/core @ton/crypto
          node <<'NODE'
          const { WalletContractV5R1 } = require("@ton/ton");
          const {
            Address, Cell, beginCell, external, internal,
            SendMode, storeMessage
          } = require("@ton/core");
          const { sign } = require("@ton/crypto");

          const senderRaw = process.env.SENDER;
          const sender = Address.parse(senderRaw);
          const manager = Address.parse(process.env.MANAGER);
          const payload = Cell.fromBase64(process.env.PAYLOAD);
          const api = "https://testnet.tonapi.io/v2";

          async function getJson(url) {
            const response = await fetch(url);
            const body = await response.text();
            if (!response.ok) {
              throw new Error(`GET ${url} failed: HTTP ${response.status}: ${body}`);
            }
            return JSON.parse(body);
          }

          async function main() {
            const [keyData, seqnoData] = await Promise.all([
              getJson(`${api}/accounts/${encodeURIComponent(senderRaw)}/publickey`),
              getJson(`${api}/wallet/${encodeURIComponent(senderRaw)}/seqno`)
            ]);
            const publicKey = Buffer.from(keyData.public_key, "hex");
            if (publicKey.length !== 32) {
              throw new Error(`Unexpected public key length: ${publicKey.length}`);
            }

            const wallet = WalletContractV5R1.create({
              workchain: 0,
              walletId: { networkGlobalId: -3 },
              publicKey
            });
            console.log("Derived V5R1 address:", wallet.address.toRawString());
            console.log("Connected wallet address:", sender.toRawString());
            if (!wallet.address.equals(sender)) {
              throw new Error("Derived V5R1 address does not match connected wallet.");
            }

            const seqno = Number(seqnoData.seqno);
            const timeout = Math.floor(Date.now() / 1000) + 300;
            const walletBody = await wallet.createTransfer({
              seqno,
              signer: async message => sign(message.hash(), Buffer.alloc(64)),
              timeout,
              sendMode: SendMode.PAY_GAS_SEPARATELY + SendMode.IGNORE_ERRORS,
              messages: [internal({
                to: manager,
                value: 50000000n,
                bounce: true,
                body: payload
              })]
            });
            const externalMessage = beginCell()
              .store(storeMessage(external({
                to: wallet.address,
                init: seqno === 0 ? wallet.init : undefined,
                body: walletBody
              })))
              .endCell();
            const boc = externalMessage.toBoc().toString("base64");
            console.log("Wallet version: V5R1; seqno:", seqno, "timeout:", timeout);
            console.log("External BOC built using Tonkeeper's wallet-emulation signing method.");
            console.log("Calling the same TonAPI endpoint used by Tonkeeper: POST /v2/wallet/emulate");

            const walletResponse = await fetch(`${api}/wallet/emulate`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ boc })
            });
            const walletBodyText = await walletResponse.text();
            console.log("TonAPI wallet/emulate HTTP status:", walletResponse.status);
            console.log(walletBodyText);
            if (!walletResponse.ok) {
              console.log("Trying detailed trace emulation to distinguish wallet endpoint failure from contract execution failure.");
              const traceResponse = await fetch(`${api}/traces/emulate?ignore_signature_check=true`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ boc })
              });
              const traceText = await traceResponse.text();
              console.log("TonAPI traces/emulate HTTP status:", traceResponse.status);
              console.log(traceText);
              if (!traceResponse.ok) process.exitCode = 1;
            }
          }

          main().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

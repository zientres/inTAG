<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061426">
  <title>TagitalSpace — Коллекции</title>
  <link rel="stylesheet" href="style.css?v=registration-region-3">
  <style>
    .settings-button {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      border: 1px solid rgba(120, 186, 255, 0.35);
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .settings-button:hover {
      background: rgba(120, 186, 255, 0.1);
      border-color: #78baff;
    }

    .settings-button span {
      width: 19px;
      height: 2px;
      border-radius: 2px;
      background: #f3f6fb;
    }

    .settings-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.48);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s, visibility 0.25s;
    }

    .settings-overlay.is-open {
      opacity: 1;
      visibility: visible;
    }

    .settings-drawer {
      position: fixed;
      z-index: 101;
      top: 0;
      right: 0;
      width: min(360px, 88vw);
      height: 100vh;
      height: 100dvh;
      padding: 30px 26px;
      overflow-y: auto;
      background: #091a2e;
      border-left: 1px solid rgba(120, 186, 255, 0.18);
      box-shadow: -15px 0 45px rgba(0, 0, 0, 0.25);
      transform: translateX(102%);
      transition: transform 0.28s ease;
    }

    .settings-drawer.is-open {
      transform: translateX(0);
    }

    .settings-drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 38px;
    }

    .settings-drawer-title {
      color: #f3f6fb;
      font-size: 23px;
      font-weight: 650;
    }

    .settings-close {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(120, 186, 255, 0.25);
      border-radius: 8px;
      color: #f3f6fb;
      background: transparent;
      font-size: 25px;
      cursor: pointer;
    }

    .settings-close:hover {
      background: rgba(120, 186, 255, 0.1);
    }

    .settings-label {
      display: block;
      margin-bottom: 14px;
      color: #a8b8cc;
      font-size: 13px;
    }

    .language-options {
      display: grid;
      gap: 10px;
    }

    .language-option {
      width: 100%;
      min-height: 52px;
      padding: 0 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(120, 186, 255, 0.18);
      border-radius: 9px;
      color: #dce7f5;
      background: rgba(255, 255, 255, 0.025);
      font: inherit;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .language-option:hover {
      background: rgba(120, 186, 255, 0.08);
    }

    .language-option.is-active {
      border-color: #78baff;
      background: rgba(120, 186, 255, 0.1);
      color: #fff;
    }

    .language-check {
      color: #78baff;
      opacity: 0;
    }

    .language-option.is-active .language-check {
      opacity: 1;
    }

    body.settings-open {
      overflow: hidden;
    }

    @media (max-width: 700px) {
      .settings-button {
        width: 38px;
        height: 38px;
      }

      .settings-drawer {
        padding: 25px 21px;
      }

      .marketplace-card {
        padding: 16px;
      }

      .marketplace-heading h3 {
        font-size: 19px;
      }

      .community-link-card {
        flex: initial;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <a class="brand" href="index.html" aria-label="TagitalSpace — главная">
      <img
        src="logo.png"
        alt="Логотип TagitalSpace"
        class="brand-logo"
        draggable="false"
      >
      <span>TagitalSpace</span>
    </a>

    <nav class="navigation" aria-label="Основная навигация">
      <a href="collection.html" data-i18n="navCollection">Коллекции</a>
      <a href="auctions.html" data-i18n="navAuctions">Аукционы</a>
      <a href="community.html" data-i18n="navCommunity">Сообщество</a>
    </nav>

    <div class="header-actions">
      <button
        class="header-button"
        id="connect-wallet"
        type="button"
        data-i18n="connectWallet"
      >Подключить кошелёк</button>

      <button
        class="settings-button"
        id="settings-open"
        type="button"
        aria-label="Открыть настройки"
        aria-controls="settings-drawer"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

    <div
    class="settings-overlay"
    id="settings-overlay"
    aria-hidden="true"
  ></div>

    <aside
    class="settings-drawer"
    id="settings-drawer"
    aria-label="Настройки"
    aria-hidden="true"
    inert
  >
    <div class="settings-drawer-header">
      <h2 class="settings-drawer-title" data-i18n="settingsTitle">
        Настройки
      </h2>

      <button
        class="settings-close"
        id="settings-close"
        type="button"
        aria-label="Закрыть настройки"
      >×</button>
    </div>

    <div class="settings-section">
      <span class="settings-label" data-i18n="languageLabel">
        Язык сайта
      </span>

      <div class="language-options">
        <button
          class="language-option is-active"
          type="button"
          data-language="ru"
          aria-pressed="true"
        >
          <span>Русский</span>
          <span class="language-check" aria-hidden="true">✓</span>
        </button>

        <button
          class="language-option"
          type="button"
          data-language="en"
          aria-pressed="false"
        >
          <span>English</span>
          <span class="language-check" aria-hidden="true">✓</span>
        </button>
      </div>
    </div>
  </aside>
  <main class="collections-page">
    <section class="collections-catalog" id="collections-catalog" aria-label="Коллекции стран">
      <div class="collections-grid">
        <button class="country-collection-card" id="open-russia-collection" type="button" aria-label="Открыть коллекцию России">
          <span class="collection-preview collection-preview-ru" aria-hidden="true">
            <span class="flag-diagonal">
              <span class="flag-band flag-band-white"></span>
              <span class="flag-band flag-band-blue"></span>
              <span class="flag-band flag-band-red"></span>
            </span>
          </span>
          <span class="collection-card-info"><span class="collection-card-name">Россия</span></span>
        </button>
      </div>
    </section>

    <section class="russia-collection" id="russia-collection" hidden>
      <button class="collection-back" id="back-to-collections" type="button" aria-label="Вернуться к коллекциям">←</button>
      <div class="russia-collection-content">
        <h1>Зарегистрировать номерной знак России</h1>
        <p class="russia-collection-subtitle">введите нужную комбинацию в поле снизу:</p>

        <div class="license-plate plate--ru registration-plate" aria-label="Введите российский номерной знак">
          <div class="registration-main" aria-label="Основная часть номера">
            <input class="plate-character plate-letter" type="text" maxlength="1" inputmode="text" aria-label="Первая буква" placeholder="_" autocomplete="off">
            <input class="plate-character plate-digit" type="text" maxlength="1" inputmode="numeric" aria-label="Первая цифра" placeholder="_" autocomplete="off">
            <input class="plate-character plate-digit" type="text" maxlength="1" inputmode="numeric" aria-label="Вторая цифра" placeholder="_" autocomplete="off">
            <input class="plate-character plate-digit" type="text" maxlength="1" inputmode="numeric" aria-label="Третья цифра" placeholder="_" autocomplete="off">
            <input class="plate-character plate-letter" type="text" maxlength="1" inputmode="text" aria-label="Вторая буква" placeholder="_" autocomplete="off">
            <input class="plate-character plate-letter" type="text" maxlength="1" inputmode="text" aria-label="Третья буква" placeholder="_" autocomplete="off">
          </div>
          <div class="plate-divider" aria-hidden="true"></div>
          <div class="plate-region-block registration-region">
            <div class="registration-region-inputs">
              <input class="plate-character plate-region-character" type="text" maxlength="1" inputmode="numeric" aria-label="Первая цифра региона" placeholder="_" autocomplete="off">
              <input class="plate-character plate-region-character" type="text" maxlength="1" inputmode="numeric" aria-label="Вторая цифра региона" placeholder="_" autocomplete="off">
              <input class="plate-character plate-region-character" type="text" maxlength="1" inputmode="numeric" aria-label="Третья цифра региона" placeholder="_" autocomplete="off">
            </div>
            <div class="plate-region-country">RUS</div>
          </div>
        </div>

        <div class="auction-timer" id="auction-timer" role="timer" aria-label="Осталось времени на аукцион">
          <span class="timer-digit" data-digit="0">0</span>
          <span class="timer-digit" data-digit="1">1</span>
          <span class="timer-separator">:</span>
          <span class="timer-digit" data-digit="2">3</span>
          <span class="timer-digit" data-digit="3">0</span>
          <span class="timer-separator">:</span>
          <span class="timer-digit" data-digit="4">0</span>
          <span class="timer-digit" data-digit="5">0</span>
        </div>

        <div class="auction-test-controls">
          <button class="primary-button auction-start-button" id="start-test-auction" type="button">Сделать ставку и начать аукцион</button>
          <button class="auction-stop-button" id="stop-test-auction" type="button" disabled>Остановить аукцион</button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js?v=timer-roll-down-2"></script>
</body>
</html>

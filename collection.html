<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061426">
  <title>inTAG — Коллекции</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a class="brand" href="index.html" aria-label="inTAG — главная">
      <img
        src="logo.png"
        alt="Логотип inTAG"
        class="brand-logo"
        draggable="false"
      >
      <span>inTAG</span>
    </a>

    <nav class="navigation" aria-label="Основная навигация">
      <a href="collection.html" data-i18n="navCollection">Коллекции</a>
      <a href="auctions.html" data-i18n="navAuctions">Аукционы</a>
      <a href="community.html" data-i18n="navCommunity">Сообщество</a>
    </nav>

    <div class="header-actions">
      <button
        class="header-button"
        id="connect-wallet"
        type="button"
        data-i18n="connectWallet"
      >Подключить кошелёк</button>

      <button
        class="settings-button"
        id="settings-open"
        type="button"
        aria-label="Открыть настройки"
        aria-controls="settings-drawer"
        aria-expanded="false"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <main class="collections-page">
    <section class="collections-catalog" aria-label="Коллекции">
      <div class="collections-grid">
        <article class="country-collection-card" aria-label="Россия">
          <div class="collection-preview collection-preview-ru" aria-hidden="true"><div class="flag-diagonal"><span class="flag-band flag-band-white"></span><span class="flag-band flag-band-blue"></span><span class="flag-band flag-band-red"></span></div></div>
          <div class="collection-card-info">
            <h2>Россия</h2>
          </div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
